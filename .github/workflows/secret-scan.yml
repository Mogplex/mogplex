name: secret-scan

on:
  pull_request:
  # trufflehog is a required check; it must also report on merge-queue groups.
  merge_group:
  push:
    branches:
      - main
  schedule:
    - cron: "19 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trufflehog:
    name: trufflehog
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      TRUFFLEHOG_VERSION: 3.94.3
      TRUFFLEHOG_LINUX_AMD64_SHA256: 7cc45010bfac7258a23731bc3ab4371abdbf20ffc705075066971e5aa8ebda7f
      TRUFFLEHOG_LINUX_ARM64_SHA256: 57699423c593b63d5baa690ca4105f13b61c80480177160c6fc4b31cbac3af56
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Install TruffleHog
        run: |
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64)
              ARCHIVE="trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
              ARCHIVE_SHA256="$TRUFFLEHOG_LINUX_AMD64_SHA256"
              ;;
            aarch64|arm64)
              ARCHIVE="trufflehog_${TRUFFLEHOG_VERSION}_linux_arm64.tar.gz"
              ARCHIVE_SHA256="$TRUFFLEHOG_LINUX_ARM64_SHA256"
              ;;
            *)
              echo "Unsupported runner architecture: $ARCH" >&2
              exit 1
              ;;
          esac

          curl -sSfL \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/${ARCHIVE}" \
            -o "$ARCHIVE"
          echo "${ARCHIVE_SHA256}  ${ARCHIVE}" | sha256sum -c -
          tar -xzf "$ARCHIVE" trufflehog
          install -m 0755 trufflehog /usr/local/bin/trufflehog
          trufflehog --version

      - name: Scan repository and history for secrets
        # Box detector excluded: the repo has no Box integration, and Box's
        # 32-char token pattern ([0-9a-zA-Z]{32}) matches ordinary 32-char
        # identifiers (e.g. `resolveBillingLinkedProjectOwner`). Box's verify
        # endpoint also times out, classifying those as `unknown`, which trips
        # `--fail`. All other detectors keep the strict verified,unknown posture.
        run: trufflehog git "file://${GITHUB_WORKSPACE}" --results=verified,unknown --exclude-detectors=Box --fail
