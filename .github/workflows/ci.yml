name: ci

on:
  pull_request:
  # Required for the merge queue: queued PRs are tested as merge groups, and
  # required checks that never report on merge_group block the queue forever.
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: 22.22.0
  PNPM_VERSION: 10.12.4
  NEXT_TELEMETRY_DISABLED: 1
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
  SUPABASE_SERVICE_ROLE_KEY: test-service-role-key

jobs:
  lint:
    name: lint
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
          pnpm --version

      - name: Resolve pnpm store path
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Restore pnpm store cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Check merge_group triggers
        # A required check that never reports on merge_group stalls the merge
        # queue for the full check_response_timeout. Structural guard, see the
        # script header.
        run: node scripts/check-merge-group-triggers.mjs

  typecheck:
    name: typecheck
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
          pnpm --version

      - name: Resolve pnpm store path
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Restore pnpm store cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm typecheck

  test:
    name: test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    env:
      SANDBOX_BILLING_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mogplex_test
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: mogplex_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mogplex_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
          pnpm --version

      - name: Resolve pnpm store path
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Restore pnpm store cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test:all

  build:
    name: build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
          pnpm --version

      - name: Resolve pnpm store path
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Restore pnpm store cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run production build
        run: pnpm build

  neon-branch:
    # Ephemeral per-run database: fork the Neon default branch (copy-on-write,
    # schema + data) so each CI run gets its own isolated database. Without
    # this, speculative merge-queue builds run e2e concurrently against the
    # SHARED live database, and any isolation weakness becomes a queue
    # eviction that rebuilds everything behind it.
    #
    # Falls back to the shared DATABASE_URL (with a warning) until
    # NEON_API_KEY (secret) and NEON_PROJECT_ID (repo variable) are
    # configured. Branches are named ci-run-<run_id>-<attempt>; if the
    # cleanup job ever misses one, sweep branches with that prefix manually.
    name: neon-branch
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      branch_id: ${{ steps.create.outputs.branch_id }}
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
    steps:
      - name: Create ephemeral Neon branch
        id: create
        run: |
          set -euo pipefail
          if [ -z "${NEON_API_KEY}" ] || [ -z "${NEON_PROJECT_ID}" ]; then
            echo "::warning::NEON_API_KEY / NEON_PROJECT_ID not configured; e2e runs against the shared database, so concurrent merge-queue builds can interfere with each other."
            echo "branch_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch_name="ci-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # The response embeds connection URIs with passwords — never echo it.
          response=$(curl -fsS -X POST \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches" \
            -H "Authorization: Bearer ${NEON_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"branch\": {\"name\": \"${branch_name}\"}, \"endpoints\": [{\"type\": \"read_write\"}]}")
          branch_id=$(jq -r '.branch.id' <<<"$response")
          if [ -z "$branch_id" ] || [ "$branch_id" = "null" ]; then
            echo "Branch creation returned no branch id" >&2
            exit 1
          fi
          echo "Created Neon branch ${branch_name} (${branch_id})"
          echo "branch_id=${branch_id}" >> "$GITHUB_OUTPUT"

  e2e-shard:
    # Sharded at the spec-file level to cut merge-queue cycle time: the suite
    # runs with workers:1 (flows-api specs share in-memory server state), so
    # parallelism has to come from separate machines, each with its own Next
    # server. All four shards share the per-run Neon branch — specs
    # self-provision their rows, so intra-run sharing is safe; the branch
    # isolates this run from other queue entries.
    name: e2e-shard (${{ matrix.shard }}/4)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    needs: neon-branch
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      # Not a real secret: without it the e2e server boots with an unhandled
      # BetterAuthError rejection (better-auth refuses its default secret).
      # Must be >= 32 chars — the catch-all auth route 503s below that in
      # production builds.
      BETTER_AUTH_SECRET: e2e-ci-placeholder-secret-0123456789abcdef
      # Not a real secret: /api/auth/github's OAuth path throws without it,
      # and e2e specs assert the redirect to github.com/login/oauth/authorize
      # (maxRedirects: 0 — no real GitHub round trip ever uses this value).
      GITHUB_CLIENT_ID: e2e-ci-placeholder-client-id
      # Neon connection for the real-database auth specs and (with the
      # backend flip below) every supabaseAdmin call in the server. The auth
      # spec files self-skip when this is unset.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Run the whole e2e suite through the pg-backed PostgREST shim against
      # real Neon: every server-side supabaseAdmin call is continuously
      # integration-tested here instead of hitting the placeholder Supabase
      # URL. Production keeps the Supabase backend until the data-copy flip.
      MOGPLEX_DATA_BACKEND: neon
      NEXT_PUBLIC_MOGPLEX_DATA_BACKEND: neon
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
          pnpm --version

      - name: Resolve pnpm store path
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Restore pnpm store cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Point DATABASE_URL at the ephemeral Neon branch
        # Job outputs drop masked values, so the branch job hands over only
        # the (non-secret) branch id and each shard resolves its own
        # connection string. Role and database names are parsed from the
        # shared DATABASE_URL — the branch is a fork, so they are identical.
        if: needs.neon-branch.outputs.branch_id != ''
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          BRANCH_ID: ${{ needs.neon-branch.outputs.branch_id }}
        run: |
          set -euo pipefail
          stripped="${DATABASE_URL#*://}"
          role_name="${stripped%%@*}"
          role_name="${role_name%%:*}"
          database_name="${stripped##*/}"
          database_name="${database_name%%\?*}"
          uri=$(curl -fsS -G \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/connection_uri" \
            -H "Authorization: Bearer ${NEON_API_KEY}" \
            --data-urlencode "branch_id=${BRANCH_ID}" \
            --data-urlencode "database_name=${database_name}" \
            --data-urlencode "role_name=${role_name}" \
            --data-urlencode "pooled=true" \
            | jq -r '.uri')
          if [ -z "$uri" ] || [ "$uri" = "null" ]; then
            echo "Failed to resolve a connection URI for branch ${BRANCH_ID}" >&2
            exit 1
          fi
          echo "::add-mask::${uri}"
          echo "DATABASE_URL=${uri}" >> "$GITHUB_ENV"
          echo "e2e uses ephemeral Neon branch ${BRANCH_ID}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Playwright browser cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright e2e suite
        run: pnpm test:e2e --shard=${{ matrix.shard }}/4

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  neon-branch-cleanup:
    # Deletes the per-run branch whether the shards passed, failed, or were
    # cancelled. NOT a required check — if this ever misses (runner death),
    # the only cost is a stale ci-run-* branch to sweep manually.
    name: neon-branch-cleanup
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    needs: [neon-branch, e2e-shard]
    if: always() && needs.neon-branch.outputs.branch_id != ''
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      BRANCH_ID: ${{ needs.neon-branch.outputs.branch_id }}
    steps:
      - name: Delete ephemeral Neon branch
        run: |
          set -euo pipefail
          curl -fsS -X DELETE \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches/${BRANCH_ID}" \
            -H "Authorization: Bearer ${NEON_API_KEY}" > /dev/null
          echo "Deleted Neon branch ${BRANCH_ID}"

  e2e:
    # Fan-in for the shard matrix. The branch ruleset requires a check named
    # "e2e"; matrix jobs report as "e2e-shard (n/4)", so this job carries the
    # required context. `if: always()` makes it report even when shards fail —
    # a required check that never reports would block the merge queue forever.
    name: e2e
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    needs: e2e-shard
    if: always()
    steps:
      - name: Check shard results
        env:
          SHARDS_RESULT: ${{ needs.e2e-shard.result }}
        run: |
          if [ "$SHARDS_RESULT" != "success" ]; then
            echo "e2e shards finished with result: $SHARDS_RESULT" >&2
            exit 1
          fi
          echo "All e2e shards passed."
