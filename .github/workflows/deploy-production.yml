name: deploy-production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HUSKY: 0
  NODE_VERSION: 22.22.0
  PNPM_VERSION: 10.12.4
  VERCEL_CLI_VERSION: 58.7.1

jobs:
  migrate-production:
    name: migrate-production
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    # Migrations are optional while the database moves from Supabase to Neon:
    # without SUPABASE_DB_URL the job succeeds with a warning so the Vercel
    # deploy still ships. (secrets are not readable in job-level `if`, hence
    # the env indirection on each step.)
    env:
      SUPABASE_DB_URL_PRESENT: ${{ secrets.SUPABASE_DB_URL != '' }}
      DATABASE_URL_PRESENT: ${{ secrets.DATABASE_URL != '' }}
    steps:
      - name: Note migrations skipped
        if: ${{ env.SUPABASE_DB_URL_PRESENT != 'true' && env.DATABASE_URL_PRESENT != 'true' }}
        run: |
          echo "::warning::Skipping database migrations because neither SUPABASE_DB_URL nor DATABASE_URL is configured."

      - name: Check out repository
        if: ${{ env.SUPABASE_DB_URL_PRESENT == 'true' || env.DATABASE_URL_PRESENT == 'true' }}
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Neon migrations (neon/migrations/*.sql, tracked in
      # neon_migrations.schema_migrations). Runs before the Supabase push so
      # the Neon side is never behind when both are configured during the
      # transition; each migration runs in its own transaction.
      - name: Set up Node.js for Neon migrations
        if: ${{ env.DATABASE_URL_PRESENT == 'true' }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm via Corepack
        if: ${{ env.DATABASE_URL_PRESENT == 'true' }}
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate

      - name: Install dependencies for Neon migrations
        if: ${{ env.DATABASE_URL_PRESENT == 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Apply Neon migrations
        if: ${{ env.DATABASE_URL_PRESENT == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm exec tsx scripts/apply-neon-migrations.ts

      - name: Set up Supabase CLI
        if: ${{ env.SUPABASE_DB_URL_PRESENT == 'true' }}
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1

      # Note: `supabase db push` sends each migration file through a
      # Postgres extended-query pipeline, so statements that cannot run in
      # a pipeline (e.g. `CREATE INDEX CONCURRENTLY`) must be applied out
      # of band, not added here. Keep migrations pipeline-compatible.
      #
      # The default `supabase/setup-cli@v1` build predates the `--yes`
      # flag and `supabase db push` is interactive, so feed `yes` on
      # stdin to auto-confirm. Works across CLI versions whether or not
      # `--yes` exists.
      - name: Apply production migrations
        if: ${{ env.SUPABASE_DB_URL_PRESENT == 'true' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: yes | supabase db push --db-url "$SUPABASE_DB_URL" --include-all

  deploy-production:
    name: deploy-production
    needs: migrate-production
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
          pnpm --version

      - name: Install Vercel CLI
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      # --scope pins the team: the token's account belongs to multiple
      # Vercel teams since 2026-07-27, and the CLI never auto-selects a
      # team in a non-interactive terminal (every deploy failed on this
      # from #794 until the scope was pinned).
      - name: Link repository to the configured Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_SCOPE: ${{ vars.VERCEL_TEAM_SCOPE || 'webrenew' }}
        run: vercel link --repo --yes --scope "$VERCEL_TEAM_SCOPE" --token="$VERCEL_TOKEN"

      - name: Pull production environment information
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Verify Vercel CLI only wrote expected generated files
        run: |
          # Files Vercel CLI is known to mutate during bootstrap
          # (e.g. injecting `packageManager` into package.json). Revert
          # them so the build uses the committed source of truth, and
          # emit a warning so the mutation is visible in the run summary.
          ALLOWED_MUTATIONS=(package.json)
          for f in "${ALLOWED_MUTATIONS[@]}"; do
            if ! git diff --quiet -- "$f"; then
              echo "::warning file=$f::Vercel CLI mutated $f during bootstrap — reverting to committed version before build."
              git diff -- "$f" || true
              git checkout -- "$f"
            fi
          done

          TRACKED_CHANGES="$(git status --short --untracked-files=no)"
          if [ -n "$TRACKED_CHANGES" ]; then
            echo "Unexpected tracked files changed after Vercel CLI bootstrap:"
            echo "$TRACKED_CHANGES"
            exit 1
          fi

          mapfile -t GENERATED_FILES < <(
            git ls-files --others --ignored --exclude-standard .vercel | sort
          )
          if [ "${#GENERATED_FILES[@]}" -gt 0 ]; then
            echo "Generated ignored files:"
            printf '%s\n' "${GENERATED_FILES[@]}"
          fi

          for GENERATED_FILE in "${GENERATED_FILES[@]}"; do
            case "$GENERATED_FILE" in
              .vercel/.env.production.local|.vercel/README.txt|.vercel/project.json|.vercel/repo.json)
                ;;
              *)
                echo "Unexpected file was generated by Vercel CLI: $GENERATED_FILE"
                exit 1
                ;;
            esac
          done

          if [ "${#GENERATED_FILES[@]}" -eq 0 ]; then
            echo "Vercel CLI did not generate any ignored .vercel files."
          fi

      - name: Build production artifacts
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production artifacts
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          DEPLOYMENT_URL="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "PRODUCTION_DEPLOYMENT_URL=$DEPLOYMENT_URL" >> "$GITHUB_ENV"
          echo "Deployed production artifacts to $DEPLOYMENT_URL"

      # Trigger.dev tasks deploy via the Trigger GitHub integration on push
      # to main (org mogplex-ddb2), not from this workflow. Env for those
      # builds comes from the syncVercelEnvVars extension in trigger.config.ts.

      - name: Load production smoke auth
        run: |
          CRON_SECRET="$(python - <<'PY'
          from pathlib import Path

          path = Path(".vercel/.env.production.local")
          for line in path.read_text().splitlines():
              if not line.startswith("CRON_SECRET="):
                  continue

              value = line.split("=", 1)[1].strip().strip('"').strip("'")
              print(value, end="")
              break
          else:
              raise SystemExit("CRON_SECRET not found in .vercel/.env.production.local")
          PY
          )"
          echo "::add-mask::$CRON_SECRET"
          echo "CRON_SECRET=$CRON_SECRET" >> "$GITHUB_ENV"

      - name: Resolve production smoke base URL
        env:
          PRODUCTION_DEPLOYMENT_URL: ${{ env.PRODUCTION_DEPLOYMENT_URL }}
        run: |
          PRODUCTION_BASE_URL="$(python - <<'PY'
          from pathlib import Path

          path = Path(".vercel/.env.production.local")
          for line in path.read_text().splitlines():
              if not line.startswith("NEXT_PUBLIC_APP_URL="):
                  continue

              value = line.split("=", 1)[1].strip().strip('"').strip("'").rstrip("/")
              if value:
                  print(value, end="")
                  break
          PY
          )"

          if [ -z "$PRODUCTION_BASE_URL" ]; then
            PRODUCTION_BASE_URL="${PRODUCTION_DEPLOYMENT_URL%/}"
          fi

          echo "PRODUCTION_BASE_URL=$PRODUCTION_BASE_URL" >> "$GITHUB_ENV"

      - name: Reconcile Stripe catalog and run production smoke check
        env:
          CRON_SECRET: ${{ env.CRON_SECRET }}
          PRODUCTION_BASE_URL: ${{ env.PRODUCTION_BASE_URL }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$PRODUCTION_BASE_URL/api/cron/capacity-stripe-catalog"

          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$PRODUCTION_BASE_URL/api/cron/production-smoke"
