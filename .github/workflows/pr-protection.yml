name: pr-protection

# TESTING.md enforcement: a PR that changes behavior-bearing source must also
# change tests, or say why with a "No-tests:" line in the PR body.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  # In the merge queue this check is intentionally a no-op: the PR-level run
  # already gated queue entry, and merge groups have no PR body to inspect.
  # The job-level `if` below skips it on merge_group, and GitHub counts a
  # skipped job as satisfying a required check.
  merge_group:

permissions:
  contents: read

concurrency:
  group: pr-protection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-accompany-features:
    name: tests-accompany-features
    if: github.event_name == 'pull_request'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Require tests or a stated reason
        env:
          BASE_REF: ${{ github.base_ref }}
          # Passed via env so PR body content is never shell-interpolated.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD")

          source_changed=$(grep -E '^(app|lib|components|hooks|trigger)/.*\.(ts|tsx)$' <<<"$changed" \
            | grep -Ev '\.(test|spec)\.tsx?$' || true)
          tests_changed=$(grep -E '(^tests/|\.(test|spec)\.tsx?$)' <<<"$changed" || true)

          if [ -z "$source_changed" ] || [ -n "$tests_changed" ]; then
            echo "OK: no behavior-bearing source changed, or tests changed alongside it."
            exit 0
          fi

          if grep -Eq '^No-tests:[[:space:]]*[^[:space:]]' <<<"$PR_BODY"; then
            echo "OK: PR body states why no test changes accompany this change:"
            grep -E '^No-tests:' <<<"$PR_BODY"
            exit 0
          fi

          echo "This PR changes behavior-bearing source but no test files:"
          echo ""
          sed 's/^/  /' <<<"$source_changed"
          echo ""
          echo "Per TESTING.md, add or update tests in the tier where the behavior"
          echo "lives, or add a line to the PR body explaining why none are needed:"
          echo ""
          echo "  No-tests: <reason, naming the existing suite if one covers this>"
          exit 1

  diff-coverage:
    # Advisory (not a required check yet): changed lines in lib/** must be
    # covered by the vitest tier. The absolute lib coverage number is low and
    # irrelevant — this gates only the lines a PR touches, so coverage ratchets
    # up with each change instead of demanding a backfill. Promote to a
    # required check via the ruleset once it has run quietly for a while;
    # merge_group is already in the trigger list above, and on merge_group
    # this job skips (a skipped job satisfies a required check).
    name: diff-coverage
    if: github.event_name == 'pull_request'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.0

      - name: Set up pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.12.4 --activate
          pnpm --version

      - name: Resolve pnpm store path
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Restore pnpm store cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run vitest tier with coverage
        run: pnpm exec vitest run --coverage

      - name: Install diff-cover
        run: pipx install diff-cover

      - name: Gate coverage on changed lib lines
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          diff-cover coverage/cobertura-coverage.xml \
            --compare-branch "origin/${BASE_REF}" \
            --include "lib/**" \
            --fail-under 80
