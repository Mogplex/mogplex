name: self-host-smoke

# Builds the self-host image from this commit on both published architectures
# and boots docker-compose.yml against it (scripts/self-host-smoke.mjs):
# migrations apply to a fresh database, /api/health reports the database ok,
# cron runs, and migrations re-run cleanly. It runs once with the bundled
# postgres and once against an external database. It runs on PRs that touch the image
# or its inputs, nightly to catch everything else, and on demand.
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose*.yml
      - neon/**
      - lib/db/**
      - lib/health.ts
      - app/api/health/**
      - scripts/apply-neon-migrations.ts
      - scripts/self-host-cron.mjs
      - scripts/self-host-smoke.mjs
      - vercel.json
      - next.config.*
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/self-host-smoke.yml
      - .github/workflows/publish-image.yml
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-host-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  smoke:
    name: smoke (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: blacksmith-4vcpu-ubuntu-2404
          - arch: arm64
            runner: blacksmith-4vcpu-ubuntu-2404-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: mogplex:local
          # Also reads the release build's cache for the same architecture.
          cache-from: |
            type=gha,scope=smoke-${{ matrix.arch }}
            type=gha,scope=publish-${{ matrix.arch }}
          cache-to: type=gha,scope=smoke-${{ matrix.arch }},mode=max

      - name: Validate the build-from-source override
        run: |
          touch .env
          docker compose -f docker-compose.yml -f docker-compose.build.yml config --quiet
          rm .env
        env:
          CRON_SECRET: placeholder

      - name: Boot the compose stack
        run: node scripts/self-host-smoke.mjs
        env:
          MOGPLEX_IMAGE: mogplex
          MOGPLEX_VERSION: local

      # Same checks with DATABASE_URL pointing outside compose: the postgres
      # profile stays off, so no bundled database may start.
      - name: Boot against an external database
        run: |
          docker run -d --name external-pg -p 55432:5432 \
            -e POSTGRES_USER=external -e POSTGRES_DB=external \
            -e POSTGRES_HOST_AUTH_METHOD=trust pgvector/pgvector:pg17
          for _ in $(seq 1 60); do
            docker exec external-pg pg_isready -h 127.0.0.1 -U external -d external && break
            sleep 1
          done
          # Containers reach the runner's own address, not localhost.
          host_ip=$(hostname -I | awk '{print $1}')
          SMOKE_EXTERNAL_DATABASE_URL="postgres://external@${host_ip}:55432/external" \
            node scripts/self-host-smoke.mjs
        env:
          MOGPLEX_IMAGE: mogplex
          MOGPLEX_VERSION: local
