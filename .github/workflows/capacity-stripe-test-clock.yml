name: capacity-stripe-test-clock

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capacity-stripe-test-clock
  cancel-in-progress: false

env:
  CAPACITY_BILLING_OPERATIONS_ENABLED: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: 22.22.0
  PNPM_VERSION: 10.12.4
  STRIPE_CLI_SHA256: 6aded724c630cacff37a8f0840e3a6f545ecf5ee38bc7ddd99c8a6f629340701
  STRIPE_CLI_VERSION: 1.50.1

jobs:
  test-clock:
    name: test-clock
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
    steps:
      - name: Require Stripe test credentials
        run: |
          if [[ "$STRIPE_SECRET_KEY" != sk_test_* ]]; then
            echo "STRIPE_TEST_SECRET_KEY must contain a Stripe test secret key."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Stripe CLI
        run: |
          ARCHIVE="stripe_${STRIPE_CLI_VERSION}_linux_x86_64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/$ARCHIVE" \
            "https://github.com/stripe/stripe-cli/releases/download/v${STRIPE_CLI_VERSION}/$ARCHIVE"
          echo "$STRIPE_CLI_SHA256  $RUNNER_TEMP/$ARCHIVE" | sha256sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/$ARCHIVE" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Run capacity billing test clocks
        run: |
          set -o pipefail
          pnpm --silent billing:capacity-test-clock | tee capacity-stripe-test-clock-report.json

      - name: Upload aggregate test-clock report
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: capacity-stripe-test-clock-report
          path: capacity-stripe-test-clock-report.json
          if-no-files-found: warn
          retention-days: 30
