# Self-hosted Mogplex: the web app container.
#
# The database (Neon/Postgres), Trigger.dev, and Vercel Sandbox are external
# services, the same ones the Vercel deployment uses, so they are not bundled
# here. docs/self-hosting.md lists each one, what it unlocks, and the env
# vars it needs. Questions: https://github.com/Mogplex/mogplex/discussions

services:
  app:
    build:
      context: .
      args:
        # Inlined into the client bundle at build time — changing any of
        # these requires an image rebuild, not just a restart.
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?set in .env}
        NEXT_PUBLIC_MOGPLEX_DATA_BACKEND: ${NEXT_PUBLIC_MOGPLEX_DATA_BACKEND:-neon}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_C15T_URL: ${NEXT_PUBLIC_C15T_URL:-}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_VERCEL_APP_CLIENT_ID: ${NEXT_PUBLIC_VERCEL_APP_CLIENT_ID:-}
    # Server-side runtime env. Copy .env.example to .env and fill in the
    # values for the services you provisioned.
    env_file:
      - .env
    ports:
      - "3000:3000"
    restart: unless-stopped
