# Slack app manifest for a self-hosted Mogplex deployment.
# Create the app at https://api.slack.com/apps -> Create New App -> From a manifest,
# after replacing mogplex.example.com with your deployment's domain.
# Bot scopes must match SLACK_BOT_SCOPES in lib/slack/oauth.ts (enforced by tests).
display_information:
  name: Mogplex
  description: Run Mogplex agents from Slack
features:
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: mogplex
    always_online: true
  slash_commands:
    - command: /mogplex
      url: https://mogplex.example.com/api/webhooks/slack
      description: Mogplex commands
      usage_hint: help | status | cancel | repo | prs | issues | usage | model | harness | agent
      should_escape: false
    - command: /mogplex-cancel
      url: https://mogplex.example.com/api/webhooks/slack
      description: Cancel your active Mogplex run in this channel
      usage_hint: "[run-id]"
      should_escape: false
    - command: /harness
      url: https://mogplex.example.com/api/webhooks/slack
      description: View or choose your repository runner
      usage_hint: "[mogplex|codex|claude-code]"
      should_escape: false
oauth_config:
  redirect_urls:
    - https://mogplex.example.com/api/integrations/slack/callback
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - chat:write
      - commands
      - files:read
      - groups:history
      - groups:read
      - im:history
      - im:read
      - mpim:history
      - mpim:read
      - users:read
      - users:read.email
settings:
  event_subscriptions:
    request_url: https://mogplex.example.com/api/webhooks/slack
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
      - message.mpim
  interactivity:
    is_enabled: true
    request_url: https://mogplex.example.com/api/webhooks/slack
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
